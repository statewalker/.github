name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    uses: statewalker/statewalker-ci/.github/workflows/ci.yml@main
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
