name: CI

# The CI every statewalker monorepo runs. A repository calls it from its own
# .github/workflows/ci.yml:
#
#   jobs:
#     ci:
#       uses: statewalker/statewalker-ci/.github/workflows/ci.yml@main
#
# Steps, in order: frozen install, the dependency-reference convention, lint,
# format, build, typecheck (after the build: packages resolve each other through
# `exports` that point at dist/), tests, then the publishing checks on the built
# packages (export targets exist, dist imports are declared dependencies, packed
# manifests carry no workspace:/catalog: specifiers). Root scripts that a
# repository does not define are skipped, unless it opted into the required
# baseline with the `baseline` input (library or app): then a missing required
# script, or a test file no typecheck step compiles, fails the job. Opt-in too:
# publint and attw (`package-checks`), the API diff against npm (`api-diff`), the
# secret scan (`secret-scan`) and the release-path check (`release-path`).

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version.
        type: string
        default: "24"
      setup:
        description: Shell commands to run after the build and before the tests (browsers, services, ...).
        type: string
        default: ""
      test-command:
        description: The test command.
        type: string
        default: pnpm run test
      checks-ref:
        description: The ref of statewalker/statewalker-ci to take the check scripts from.
        type: string
        default: main
      baseline:
        description: >-
          The required CI baseline: `library` (lint:check, format:check, build, typecheck and test
          must exist), `app` (build and typecheck), or `off` (skip root scripts that are missing).
          With library or app, tests must be typechecked too. Projects switch it on one by one.
        type: string
        default: "off"
      package-checks:
        description: Run publint and attw (Are the Types Wrong?) on every packed public package.
        type: boolean
        default: false
      attw-profile:
        description: The attw profile, `esm-only` (default), `node16` or `strict`.
        type: string
        default: esm-only
      secret-scan:
        description: Scan the repository's files for committed secrets with gitleaks (before the install).
        type: boolean
        default: false
      release-path:
        description: >-
          Fail a publish step (npm/pnpm/yarn publish, changeset publish, a script running one,
          changesets/action with publish) anywhere but the standard `publish` job of ci.yml.
        type: boolean
        default: false
      api-diff:
        description: >-
          Compare each public package's API with its version on npm, and fail a breaking change
          that no changeset or version bump declares. Rolled out lowest layer first.
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # The secret scan reads the commits of the pull request (or push): it needs their history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.secret-scan && '0' || '1' }}

      - name: Check scripts
        uses: actions/checkout@v7
        with:
          repository: statewalker/statewalker-ci
          ref: ${{ inputs.checks-ref }}
          path: .statewalker-ci

      # Out of the repository, so linting and packing never see them.
      - name: Move the check scripts out of the workspace
        run: mv .statewalker-ci "$RUNNER_TEMP/statewalker-ci"

      # Before the install, so only the repository's own files are scanned.
      - name: Install gitleaks
        if: inputs.secret-scan
        run: bash "$RUNNER_TEMP/statewalker-ci/scripts/install-gitleaks.sh"

      - name: Secret scan
        if: inputs.secret-scan
        env:
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-secrets.mjs"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # publint, attw, TypeScript for the API diff, yaml for the release path: pinned by the
      # lockfile of statewalker/statewalker-ci.
      - name: Install the check tools
        if: inputs.package-checks || inputs.api-diff || inputs.release-path
        run: pnpm install --frozen-lockfile --dir "$RUNNER_TEMP/statewalker-ci"

      - name: Release path
        if: inputs.release-path
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-release-path.mjs"

      - name: Dependency references
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-conventions.mjs"

      - name: Required scripts and typechecked tests
        if: inputs.baseline != 'off'
        env:
          BASELINE: ${{ inputs.baseline }}
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-scripts.mjs" "$BASELINE"

      # `--if-present` skips a missing script; the baseline drops it for the scripts it requires.
      - name: Lint
        run: pnpm run ${{ inputs.baseline != 'library' && '--if-present' || '' }} lint:check

      - name: Format
        run: pnpm run ${{ inputs.baseline != 'library' && '--if-present' || '' }} format:check

      - name: Build
        run: pnpm run ${{ inputs.baseline == 'off' && '--if-present' || '' }} build

      - name: Typecheck
        run: pnpm run ${{ inputs.baseline == 'off' && '--if-present' || '' }} typecheck

      - name: Typecheck tests
        if: inputs.baseline != 'off'
        run: pnpm run --if-present typecheck:tests

      - name: Setup for tests
        if: inputs.setup != ''
        run: ${{ inputs.setup }}

      - name: Test
        run: ${{ inputs.test-command }}

      - name: Export targets
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-exports.mjs"

      - name: Dist imports
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-dist-imports.mjs"

      - name: Packed manifests
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-pack.mjs"

      - name: publint and attw
        if: inputs.package-checks
        env:
          ATTW_PROFILE: ${{ inputs.attw-profile }}
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-package-tools.mjs" --attw-profile "$ATTW_PROFILE"

      - name: API diff against npm
        if: inputs.api-diff
        run: node "$RUNNER_TEMP/statewalker-ci/scripts/check-api-diff.mjs"
