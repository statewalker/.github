name: Self-test

# This repository's own CI: the check scripts against the fixture repositories in fixtures/, the
# checks that apply to this repository itself, and a lint of the workflows every statewalker
# project calls.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gitleaks
        run: bash scripts/install-gitleaks.sh
      # Before the install, so node_modules is not scanned.
      - name: Secret scan of this repository
        run: node scripts/check-secrets.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check scripts against the fixtures
        run: pnpm test
      - name: Release path of this repository
        run: node scripts/check-release-path.mjs
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
